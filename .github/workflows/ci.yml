name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Clippy builds metadata only and tests need full codegen, so the two can't
  # share dependency artifacts; separate jobs build them in parallel instead
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installs the toolchain pinned in rust-toolchain.toml and removes the
      # runner's preinstalled ones, which rust-cache would otherwise hash into
      # its key (that changes whenever the runner image's stable does)
      - run: |
          rustup toolchain install
          active=$(rustup show active-toolchain | cut -d' ' -f1)
          rustup toolchain list | cut -d' ' -f1 | grep -vx "$active" | xargs -r rustup toolchain uninstall

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installs the toolchain pinned in rust-toolchain.toml and removes the
      # runner's preinstalled ones, which rust-cache would otherwise hash into
      # its key (that changes whenever the runner image's stable does)
      - run: |
          rustup toolchain install
          active=$(rustup show active-toolchain | cut -d' ' -f1)
          rustup toolchain list | cut -d' ' -f1 | grep -vx "$active" | xargs -r rustup toolchain uninstall

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked
